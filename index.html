<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Important question 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe3ec;--ink:#4a1330;--yes:#e8336d;--yesink:#fff;--no:#fff;--noink:#4a1330;--card:#fff7fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0d1d;--ink:#ffe3ec;--no:#4a1330;--noink:#ffe3ec;--card:#3a1228}}
:root[data-theme="dark"]{--bg:#2a0d1d;--ink:#ffe3ec;--no:#4a1330;--noink:#ffe3ec;--card:#3a1228}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center;overflow-x:hidden}
main{width:100%;max-width:640px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:20px}
.emoji{font-size:clamp(64px,18vw,110px);line-height:1;transition:transform .2s}
h1{font-size:clamp(28px,7vw,44px);margin:0;line-height:1.15;font-weight:700}
.joke{min-height:3.2em;font-size:clamp(16px,4.2vw,20px);margin:0;max-width:30ch}
.btns{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;transition:transform .12s,font-size .25s,padding .25s}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
button:active{transform:scale(.95)}
#yes{background:var(--yes);color:var(--yesink);font-size:22px;padding:.6em 1.6em;max-width:100%;box-shadow:0 6px 0 rgba(0,0,0,.18)}
#no{background:var(--no);color:var(--noink);font-size:18px;padding:.6em 1.4em;border:3px solid var(--ink)}
.gone{display:none}
.rain{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rain{animation-duration:.01s}button{transition:none}}
.pic{width:min(70vw,260px);aspect-ratio:1;object-fit:cover;border-radius:50%;border:6px solid var(--yes)}
</style>
</head>
<body>
<main id="app">
  <div class="emoji" id="emoji">🥺</div>
  <h1 id="title">Hobbi Karima, Do you wanna go on a date with me? Naklou meshwi ?</h1>
  <p class="joke" id="joke">(Jarreb 9oul lee.)</p>
  <div class="btns">
    <button id="yes">Yes 💖</button>
    <button id="no">No</button>
  </div>
</main>
<script>
(function(){
  var yes=document.getElementById('yes'),no=document.getElementById('no'),
      joke=document.getElementById('joke'),emoji=document.getElementById('emoji'),
      title=document.getElementById('title'),n=0;
  var faces=['😳','😢','😭','🥹','😩','🫠','💔','🙏'];
  var jokes=[
    "Wrong button! It's the other one. Probably.",
    "Are you sure?.",
    "Plot twist: Is on me el 3sha. I'm just saying.",
    "Tenzel No marra okhra besh takel tri7a..",
    "Karima enzel yes yehdik.",
    "I'll let you pick the restaurant AND the playlist!",
    "Kan maksh besh tenzel Yes besh nkalem Ta Hbiba.",
    "NO is sweating. Shouf 9adeh sghart."
  ];
  function party(){
    var e=['💖','💘','🎉','🍕','💐','✨','🥳'];
    for(var i=0;i<60;i++){
      var s=document.createElement('span');
      s.className='rain';
      s.textContent=e[Math.floor(Math.random()*e.length)];
      s.style.left=Math.random()*100+'vw';
      s.style.animationDuration=(2+Math.random()*3)+'s';
      s.style.animationDelay=(Math.random()*1.5)+'s';
      document.body.appendChild(s);
    }
  }
  no.addEventListener('click',function(){
    n++;
    yes.style.fontSize=(22+n*12)+'px';
    yes.style.padding=(0.6+n*0.12)+'em '+(1.6+n*0.3)+'em';
    no.style.fontSize=Math.max(9,18-n*1.2)+'px';
    emoji.textContent=faces[(n-1)%faces.length];
    if(n>=8){
      no.classList.add('gone');
      joke.textContent="NO has left the chat. Only YES remains. Destiny.";
      title.textContent="Well... looks like it's a yes!";
    }else{
      joke.textContent=jokes[n-1];
    }
  });
  yes.addEventListener('click',function(){
    document.getElementById('app').innerHTML=
     '<img src="hobbi.jpeg" alt="Her" class="pic">' +
    '<div class="emoji">🥳</div><h1>YAY!! She said YES!</h1>'+
      '<p class="joke">Dinner is on me. 🍕💖</p>';
    party();
  });
})();
</script>
</body>
</html>
